---

# we need this as we install packages later
- name: ensure wheel, libvirt and audio groups  # OK
  ansible.builtin.command: chroot /mnt/gentoo bash -c 'source /etc/profile; emerge --quiet acct-group/wheel acct-group/libvirt acct-group/audio'

- name: setup user  # OK
  ansible.builtin.command: chroot /mnt/gentoo bash -c 'source /etc/profile; usermod -a -G users,docker,wheel,libvirt,audio,plugdev,kvm -s /bin/bash sdobrau'

- name: remove stage3 files  # OK
  ansible.builtin.file:
    path: /mnt/gentoo/stage3*
    state: absent

- name: done # OK
  ansible.builtin.debug:
    msg: "Done configuring. now just ensuring world"

# t
- name: ensure package.use directory exists
  ansible.builtin.file:
    path: /mnt/gentoo/etc/portage/package.use
    state: directory
    mode: '0755'

- name: ensure package.use nodejs entry
  ansible.builtin.copy:
    dest: /mnt/gentoo/etc/portage/package.use/nodejs
    content: "net-libs/nodejs npm"
    mode: '0644'

- name: ensure packages for non-native packages
  ansible.builtin.command: chroot /mnt/gentoo bash -c 'source /etc/profile; emerge --quiet net-misc/curl net-misc/wget dev-python/pipx dev-lang/rust-bin dev-lang/go net-libs/nodejs'

# * rust packages
- name: ensure cargo packages (cargo)
  ansible.builtin.command: chroot /mnt/gentoo bash -c 'source /etc/profile; su - sdobrau; cargo install {{ item }}'
  with_items:
    - jnv

# * go packages
- name: ensure go packages (golang)
  ansible.builtin.command: chroot /mnt/gentoo bash -c 'source /etc/profile; su - sdobrau; go install {{ item }}'
  with_items:
    - github.com/google/go-containerregistry/cmd/crane@latest
    - github.com/lc/gau/v2/cmd/gau@latest

# * python packages OK
- name: ensure python packages (pipx)
  ansible.builtin.command: chroot /mnt/gentoo bash -c 'source /etc/profile; su - sdobrau; uv tool install {{ item }}'
  with_items:
    - awscli
    - checkov
    - zuban

# t * node packages
- name: ensure jsfmt
  ansible.builtin.command: chroot /mnt/gentoo bash -c 'source /etc/profile; npm install -g jsfmt'

# * standalone packages
- name: ensure tflint
  ansible.builtin.command: chroot /mnt/gentoo bash -c 'source /etc/profile; su - sdobrau; curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash'

- name: ensure opa
  ansible.builtin.command: chroot /mnt/gentoo bash -c 'source /etc/profile; su - sdobrau; wget https://github.com/open-policy-agent/opa/releases/download/v1.15.2/opa_linux_amd64 -O ~/bin/opa'

- name: ensure parallel
  ansible.builtin.command: chroot /mnt/gentoo bash -c 'source /etc/profile; su - sdobrau; cd /tmp; wget https://ftpmirror.gnu.org/parallel/parallel-20260322.tar.bz2 && wget https://ftpmirror.gnu.org/parallel/parallel-20260322.tar.bz2.sig && gpg parallel-20260322.tar.bz2.sig && bzip2 -dc parallel-20260322.tar.bz2 | tar xvf - && cd parallel-20260322 && ./configure && make && sudo make install && cd ../ && rm -rf parallel*'

- name: ensure Hyprland split-monitor-workspaces configured
  ansible.builtin.command:  chroot /mnt/gentoo bash -c 'source /etc/profile; su - sdobrau; hyprpm -f add https://github.com/zjeffer/split-monitor-workspaces && hyprpm enable -f split-monitor-workspaces && hyprpm reload'

# * ollama OK
- name: ensure package for ollama
  ansible.builtin.command: chroot /mnt/gentoo bash -c 'source /etc/profile; emerge --quiet app-misc/ollama'

- block:
    - name: install ollama models
      ansible.builtin.command: chroot /mnt/gentoo bash -c 'source /etc/profile; su - sdobrau; ollama pull {{ item }}'
      with_items: "{{ my_ollama_models }}"

    - name: ensure ollama service override directory exists
      ansible.builtin.file:
        path: /mnt/gentoo/etc/systemd/system/ollama.service.d/
        group: root
        owner: root
        state: directory
        mode: '0755'

    - name: ensure ollama listens on 0.0.0.0 for traffic
      ansible.builtin.copy:
        src: files/maintenance/state/systemd-ollama-0000-override.conf
        dest: /mnt/gentoo/etc/systemd/system/ollama.service.d/override.conf
  when: lookup('env', 'IS_LAPTOP') != '1'

# laptop config
# get ip for ollama instance from OLLAMA_IP

# TODO: note in readme that OLLAMA_IP needs to be set

- name: set my_ollama_instance_ip from OLLAMA_IP
  set_fact:
    my_ollama_instance_ip: "{{ lookup('env', 'OLLAMA_IP') }}"
  when: lookup('env', 'IS_LAPTOP') == '1'
    - name: Reload systemd manager configuration
      ansible.builtin.systemd:
        daemon_reload: yes

- name: set my_ollama_instance_ip to 127.0.0.1 if not on laptop
  set_fact:
    my_ollama_instance_ip: "127.0.0.1"
    - name: ensure ollama service started
      ansible.builtin.service:
        name: ollama
        state: started
        enabled: true
  when: lookup('env', 'IS_LAPTOP') != '1'

# opencode
- name: Ensure opencode directory exists
  ansible.builtin.file:
    path: /mnt/gentoo/home/sdobrau/.config/opencode
    state: directory
    owner: sdobrau
    mode: '0755'

- name: configure opencode for interacting with ollama
  ansible.builtin.template:
    src: templates/opencode.j2
    dest: /mnt/gentoo/home/sdobrau/.config/opencode/opencode.json
    owner: sdobrau
    mode: '0755'

- name: Ensure opencode .local/share exists
  ansible.builtin.file:
    path: /mnt/gentoo/home/sdobrau/.local/share/opencode
    state: directory
    owner: sdobrau
    mode: '0755'

- name: opencode dummy auth
  ansible.builtin.copy:
    src: files/maintenance/config/opencode-dummy-auth.json
    dest: /mnt/gentoo/home/sdobrau/.local/share/opencode/auth.json
    owner: sdobrau
    group: sdobrau
    mode: '0755'

# * local bin OK
- name: ensure local bin exists
  ansible.builtin.file:
    path: "/mnt/gentoo/home/sdobrau/.local/bin"
    state: directory
    owner: sdobrau
    mode: '0755'

- name: ensure symlink to ~/.local/bin in ~/bin
  ansible.builtin.file:
    src: "/mnt/gentoo/home/sdobrau/.local/bin"
    dest: "/home/sdobrau/bin"
    state: link

# t * bin executables
- name: ensure bins
- name: ensure bin directory
  ansible.builtin.file:
    path: "/mnt/gentoo/home/sdobrau/bin"
    state: directory
    group: sdobrau
    owner: sdobrau
    mode: '0755'

    owner: sdobrau
    mode: '0755'
  with_items:
    - wall-auto.sh
    - git-send-email-pass
