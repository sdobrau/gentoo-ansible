---
- name: Install gentoo
  # hosts: 192.168.122.69
  hosts: default
  vars_prompt:
    - name: mirror_country
      prompt: what country for mirrors?
      default: "United Kingdom"
      private: false
    - name: timezone
      prompt: what timezone?
      default: "Europe/London"
      private: false
  vars_files:
    - vars/main.yml
  vars_prompt:
    - name: "is_laptop"
      prompt: "Are you running this on a laptop? Use 1 if yes"
    - name: "my_ollama_instance_ip"
      prompt: "What is the IP of the Ollama instance you're running?"
    - name: "is_virtual"
      prompt: "Are you running on a virtual machine? Use 1 if yes"
    - name: "is_nvme"
      prompt: "Are you using NVMe disks? Use 1 if yes"
    - name: "is_mmc"
      prompt: "Are you using MMC storage? Use 1 if yes"
  roles:
    - role: 01-preparing-the-disks  # OK?
    - role: 02-the-stage-file  # OK
    # - role: 03-installing-base-system  # OK
    # - role: 04-configuring-the-kernel  # OK
    # - role: 05-configuring-the-system  # OK
    # - role: 06-installing-tools  # OK
    # - role: 07-configuring-the-bootloader  # OK
    # - role: 08-finalizing  # OK
    # - role: 09-world-maintenance  # OK
